name: Manual Quantune Android + Windows Release

run-name: Publish Quantune release (Android + Windows)

on:
  workflow_dispatch:
    inputs:
      phone_ref:
        description: "Android phone app branch, tag or commit"
        required: true
        default: main
        type: string
      windows_ref:
        description: "Windows desktop branch, tag or commit"
        required: true
        default: windows-desktop
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: quantune-publish-release
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and sign Android phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      version_name: ${{ steps.release-version.outputs.version_name }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/Quantune
          ref: ${{ inputs.phone_ref }}

      - name: Read app version for this release
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | head -n 1)"
          [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing Quantune $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK and Build Tools
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Compile ARM64-v8a release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign Android APK with shared D.S-Apps release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
          SIGNING_KEYSTORE_TYPE: PKCS12
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing BATTERYPULSE_KEYSTORE_BASE64}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing BATTERYPULSE_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing BATTERYPULSE_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing BATTERYPULSE_KEY_PASSWORD}"

          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"
          test -s "$SOURCE_APK"

          KEYSTORE="$RUNNER_TEMP/dsmusic-release-keystore.p12"
          ALIGNED_APK="$RUNNER_TEMP/dsmusic-android-aligned.apk"
          OUTPUT_APK="$RUNNER_TEMP/Quantune-Android.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype "$SIGNING_KEYSTORE_TYPE" -keystore "$KEYSTORE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type "$SIGNING_KEYSTORE_TYPE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          mkdir -p release-assets/android
          cp "$OUTPUT_APK" release-assets/android/Quantune-Android.apk
          sha256sum release-assets/android/Quantune-Android.apk \
            > release-assets/android/Quantune-Android.apk.sha256
          "$APK_SIGNER" verify --verbose --print-certs release-assets/android/Quantune-Android.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: quantune-android-release
          path: release-assets/android/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Windows desktop source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/D.S-Music2
          ref: ${{ inputs.windows_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Compile and package Windows installer
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :desktopApp:compileKotlin :desktopApp:packageExe

      - name: Stage Windows installer and checksum
        shell: pwsh
        run: |
          $source = Get-ChildItem "desktopApp/build/compose/binaries/main/exe" -Filter "*.exe" -File |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($null -eq $source) {
            throw "Gradle did not create a Windows .exe installer."
          }
          New-Item -ItemType Directory -Force -Path "release-assets/windows" | Out-Null
          $destination = "release-assets/windows/Quantune-Windows-Setup.exe"
          Copy-Item $source.FullName $destination -Force
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Quantune-Windows-Setup.exe" |
            Set-Content "release-assets/windows/Quantune-Windows-Setup.exe.sha256" -Encoding ascii

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: quantune-windows-release
          path: release-assets/windows/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish one release with both apps
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    timeout-minutes: 15
    steps:
      - name: Download Android release assets
        uses: actions/download-artifact@v8
        with:
          name: quantune-android-release
          path: release-assets/android

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: quantune-windows-release
          path: release-assets/windows

      - name: Verify both release packages are present
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/android/Quantune-Android.apk
          test -s release-assets/windows/Quantune-Windows-Setup.exe
          ls -lh release-assets/android release-assets/windows

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.build-android.outputs.release_tag }}
          target_commitish: ${{ inputs.phone_ref }}
          name: Quantune ${{ needs.build-android.outputs.release_tag }} — Android + Windows
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/android/Quantune-Android.apk
            release-assets/android/Quantune-Android.apk.sha256
            release-assets/windows/Quantune-Windows-Setup.exe
            release-assets/windows/Quantune-Windows-Setup.exe.sha256

      - name: Check out main for the next app version
        uses: actions/checkout@v7
        with:
          repository: DS-ann/Quantune
          ref: main
          token: ${{ github.token }}
          path: next-version

      - name: Advance version after the release is published
        working-directory: next-version
        env:
          RELEASED_VERSION: ${{ needs.build-android.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          if [[ "$CURRENT_VERSION" != "$RELEASED_VERSION" ]]; then
            echo "::warning::main is at $CURRENT_VERSION, not the released $RELEASED_VERSION; leaving main unchanged."
            exit 0
          fi
          ./.github/scripts/advance-version.sh version.properties "$RELEASED_VERSION"
          NEXT_VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Prepare Quantune $NEXT_VERSION for the next release"
          git push origin HEAD:main
