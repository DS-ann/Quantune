name: Quantune Android 6+ APK (Build Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional branch, tag, or commit to build (defaults to the selected workflow ref)"
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: quantune-android6-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            label: ARMv7a
          - abi: arm64-v8a
            label: ARM64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/Quantune
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK, Build Tools and native toolchain
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Compile ${{ matrix.label }} release APK
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          # Match the proven release build: generate the standard ABI-split APK set.
          gradle --no-daemon --build-cache --parallel assembleRelease

          BUILD_DIR="app/build/outputs/apk/release"
          echo "Generated APK outputs:"
          find "$BUILD_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n' | sort

      - name: Sign and verify ${{ matrix.label }} APK
        env:
          TARGET_ABI: ${{ matrix.abi }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
          SIGNING_KEYSTORE_TYPE: PKCS12
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing the base64-encoded release keystore secret}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing the release keystore password secret}"
          : "${SIGNING_KEY_ALIAS:?Missing the release key alias secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing the release key password secret}"

          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-${TARGET_ABI}-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/quantune-release-keystore.p12"
          ALIGNED_APK="$RUNNER_TEMP/Quantune-${TARGET_ABI}-aligned.apk"
          OUTPUT_APK="$BUILD_DIR/Quantune-${TARGET_ABI}.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          if [[ ! -s "$SOURCE_APK" ]]; then
            echo "::error::Expected split APK not found: $SOURCE_APK"
            echo "Available APK outputs:"
            find "$BUILD_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n' | sort || true
            exit 1
          fi

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list -storetype "$SIGNING_KEYSTORE_TYPE" \
            -keystore "$KEYSTORE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

          "$BUILD_TOOLS/zipalign" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type "$SIGNING_KEYSTORE_TYPE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT_APK"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$OUTPUT_APK"

          rm -f "$KEYSTORE" "$ALIGNED_APK"
          test -s "$OUTPUT_APK"

      - name: Upload ${{ matrix.label }} APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-Android-6-${{ matrix.abi }}
          path: app/build/outputs/apk/release/Quantune-${{ matrix.abi }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
