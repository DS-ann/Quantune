name: Deploy Quantune website

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "Screenshots/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare website screenshots
        run: |
          set -euo pipefail
          mkdir -p docs/assets/screenshots
          cp Screenshots/*.png docs/assets/screenshots/
          for screenshot in "Explore.png" "Full Screen Player.png" "Full screen lyrics.png" "Listen together.png" "Song recognizer.png"; do
            test -s "docs/assets/screenshots/$screenshot"
          done
          echo "Prepared $(find docs/assets/screenshots -maxdepth 1 -type f -name '*.png' | wc -l) Quantune screenshots."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
