name: Quantune ARM64 APK (Manual)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: quantune-arm64-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and native toolchain
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # assembleRelease compiles production code, runs code generation,
      # minification and resource shrinking without running test tasks.
      - name: Assemble ARM64 release APK
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel assembleRelease
          SOURCE_APK="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          test -s "$SOURCE_APK"
          mkdir -p app/build/outputs/apk/quantune-artifact
          cp "$SOURCE_APK" "$RUNNER_TEMP/quantune-release-unsigned.apk"

      - name: Sign release APK with the shared D.S-Apps key when configured
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          SOURCE_APK="$RUNNER_TEMP/quantune-release-unsigned.apk"
          OUTPUT_APK="app/build/outputs/apk/quantune-artifact/Quantune.apk"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            : "${SIGNING_KEYSTORE_PASSWORD:?Missing store password secret}"
            : "${SIGNING_KEY_ALIAS:?Missing key alias secret}"
            : "${SIGNING_KEY_PASSWORD:?Missing key password secret}"
            KEYSTORE="$RUNNER_TEMP/quantune-release-keystore.p12"
            ALIGNED_APK="$RUNNER_TEMP/quantune-aligned.apk"
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
              -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
            "$BUILD_TOOLS/zipalign" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
              --out "$OUTPUT_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT_APK"
            rm -f "$KEYSTORE" "$ALIGNED_APK"
            echo "Built and verified the signed Quantune APK."
          else
            cp "$SOURCE_APK" "$OUTPUT_APK"
            echo "::warning::Signing secrets are unavailable; this artifact is unsigned."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-ARM64
          path: app/build/outputs/apk/quantune-artifact/Quantune.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
