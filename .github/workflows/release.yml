name: Quantune • Official Android Release
run-name: Publish Quantune ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example: v1.8.19)"
        required: true
        type: string
      source_ref:
        description: "Branch, tag, or commit to build and publish"
        required: true
        type: string
        default: main
      release_notes:
        description: "Release highlights in Markdown. Leave blank to use the standard release summary."
        required: false
        type: string
      prerelease:
        description: "Publish this as a prerelease rather than the latest stable release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quantune-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish all Android APK variants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected Quantune source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/Quantune
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Build Universal, ARMv7a and ARM64 release APKs
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel assembleRelease

          BUILD_DIR="app/build/outputs/apk/release"
          echo "Generated APK outputs:"
          ls -lh "$BUILD_DIR"

          test -s "$BUILD_DIR/app-universal-release-unsigned.apk"
          test -s "$BUILD_DIR/app-armeabi-v7a-release-unsigned.apk"
          test -s "$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"

          mkdir -p release-assets
          cp "$BUILD_DIR/app-universal-release-unsigned.apk" "$RUNNER_TEMP/Quantune-Universal-unsigned.apk"
          cp "$BUILD_DIR/app-armeabi-v7a-release-unsigned.apk" "$RUNNER_TEMP/Quantune-armeabi-v7a-unsigned.apk"
          cp "$BUILD_DIR/app-arm64-v8a-release-unsigned.apk" "$RUNNER_TEMP/Quantune-arm64-v8a-unsigned.apk"

      - name: Sign and verify all three APK variants
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Configure BATTERYPULSE_KEYSTORE_BASE64 in repository Actions secrets}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Configure BATTERYPULSE_STORE_PASSWORD in repository Actions secrets}"
          : "${SIGNING_KEY_ALIAS:?Configure BATTERYPULSE_KEY_ALIAS in repository Actions secrets}"
          : "${SIGNING_KEY_PASSWORD:?Configure BATTERYPULSE_KEY_PASSWORD in repository Actions secrets}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/quantune-release-keystore.p12"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

          sign_variant() {
            local variant="$1"
            local source_apk="$2"
            local output_apk="release-assets/Quantune-${variant}.apk"
            local aligned_apk="$RUNNER_TEMP/Quantune-${variant}-aligned.apk"

            test -s "$source_apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$source_apk" "$aligned_apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-type PKCS12 \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
              --key-pass env:SIGNING_KEY_PASSWORD \
              --out "$output_apk" "$aligned_apk"

            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$output_apk"
            "$BUILD_TOOLS/zipalign" -c -p 4 "$output_apk"
            sha256sum "$output_apk" > "$output_apk.sha256"
            rm -f "$aligned_apk"
            echo "Signed and verified: $output_apk"
          }

          sign_variant "Universal" "$RUNNER_TEMP/Quantune-Universal-unsigned.apk"
          sign_variant "armeabi-v7a" "$RUNNER_TEMP/Quantune-armeabi-v7a-unsigned.apk"
          sign_variant "arm64-v8a" "$RUNNER_TEMP/Quantune-arm64-v8a-unsigned.apk"

          rm -f "$KEYSTORE" \
            "$RUNNER_TEMP/Quantune-Universal-unsigned.apk" \
            "$RUNNER_TEMP/Quantune-armeabi-v7a-unsigned.apk" \
            "$RUNNER_TEMP/Quantune-arm64-v8a-unsigned.apk"

      - name: Write polished GitHub release description
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            printf '# Quantune %s\n\n' "$RELEASE_TAG"
            printf '> Your music. Your flow. Your Quantune.\n\n'
            printf 'Quantune brings music discovery, playback, synchronized lyrics, playlists and offline listening tools together in one Android app.\n\n'
            printf '## What is included\n'
            if [ -n "$RELEASE_NOTES" ]; then
              printf '%s\n\n' "$RELEASE_NOTES"
            else
              printf '%s\n' \
                '- Discover and play music online.' \
                '- Follow synchronized and karaoke-style lyrics.' \
                '- Organize playlists, favourites and listening history.' \
                '- Save supported audio for offline listening.' \
                '- Personalize the player and use home-screen widgets.'
              printf '\n'
            fi
            printf '## Choose your APK\n\n'
            printf '| Download | Device compatibility |\n|---|---|\n'
            printf '| **Quantune-Universal.apk** | 32-bit and 64-bit ARM devices (ARMv7a + ARM64) |\n'
            printf '| **Quantune-armeabi-v7a.apk** | 32-bit ARM devices |\n'
            printf '| **Quantune-arm64-v8a.apk** | 64-bit ARM devices |\n\n'
            printf '> The Universal APK bundles both supported ARM architectures. It is not an x86/x86_64 universal package.\n\n'
            printf '## Compatibility\n\n'
            printf '- Minimum Android: **Android 6.0 (API 23)**\n'
            printf '- Package ID: `com.dsann.music`\n'
            printf '- All three APKs are signed with the project release key and verified by the workflow.\n'
            printf '- A SHA-256 checksum accompanies each APK.\n\n'
            printf '## Installation\n\n'
            printf 'Download the APK matching your device architecture. When unsure, use the Universal APK. Install only one variant; all variants use the same app ID and signing key.\n\n'
            printf '[Source code](https://github.com/DS-ann/Quantune) · [Report an issue](https://github.com/DS-ann/Quantune/issues)\n'
          } > release-description.md

      - name: Publish GitHub Release with all APK variants
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.source_ref }}
          name: Quantune ${{ inputs.release_tag }} — Android
          body_path: release-description.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Quantune-Universal.apk
            release-assets/Quantune-Universal.apk.sha256
            release-assets/Quantune-armeabi-v7a.apk
            release-assets/Quantune-armeabi-v7a.apk.sha256
            release-assets/Quantune-arm64-v8a.apk
            release-assets/Quantune-arm64-v8a.apk.sha256
