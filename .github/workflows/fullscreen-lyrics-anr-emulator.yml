name: Quantune Fullscreen Lyrics ANR Emulator

on:
  push:
    branches:
      - debug/fullscreen-lyrics-anr
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quantune-lyrics-anr-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-armv7a:
    name: Build downloadable ARMv7a APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build ARMv7a only
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel assembleDebug -PquantuneEmulatorAbi=armeabi-v7a
          APK="app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          test -s "$APK"
          COUNT="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$COUNT" -eq 1 || { echo "::error::Expected one ARMv7a APK, found $COUNT"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/debug/apk-badging.txt
          sha256sum "$APK"
      - name: Upload the ARMv7a APK (only published APK artifact)
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-armv7a-debug
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-x86:
    name: Build x86_64 emulator-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build x86_64 only
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel assembleDebug -PquantuneEmulatorAbi=x86_64
          APK="app/build/outputs/apk/debug/app-x86_64-debug.apk"
          test -s "$APK"
          COUNT="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$COUNT" -eq 1 || { echo "::error::Expected one x86_64 APK, found $COUNT"; exit 1; }
          sha256sum "$APK"
      # This short-lived artifact is an internal job-to-job handoff, not a published build.
      - name: Hand x86_64 APK to the three emulator jobs
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-x86_64-emulator-input
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 1

  reproduce:
    name: API ${{ matrix.api-level }} x86_64 — fullscreen lyrics diagnostics
    needs: build-x86
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api-level: 23
            target: default
            memory_mb: 3072
          - api-level: 30
            target: google_apis
            memory_mb: 4096
          - api-level: 35
            target: google_apis
            memory_mb: 7168
    timeout-minutes: 90
    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download internal x86_64 test APK
        uses: actions/download-artifact@v7
        with:
          name: Quantune-x86_64-emulator-input
          path: app/build/outputs/apk/debug
      - name: Verify x86_64 APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-x86_64-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Prepare diagnostics directory
        run: mkdir -p anr-artifacts
      - name: Boot API ${{ matrix.api-level }} x86_64 emulator and run lyrics tests
        id: emulator
        env:
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
          ANDROID_MEMORY_MB: ${{ matrix.memory_mb }}
          QUANTUNE_TEST_APK: app/build/outputs/apk/debug/app-x86_64-debug.apk
          QUANTUNE_EXPECTED_ABI: x86_64
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory ${{ matrix.memory_mb }} -camera-back none
          disable-animations: true
          script: bash .github/scripts/fullscreen-lyrics-anr-emulator.sh
      - name: Upload screenshots, logcat, ANR reports, traces and tombstones
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-lyrics-diagnostics-api${{ matrix.api-level }}-${{ github.run_number }}
          path: anr-artifacts/**
          if-no-files-found: warn
          retention-days: 30
      - name: Mark this API test failed if setup, flow, or ANR checks failed
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.emulator.outcome }}" != "success" ]]; then
            echo "::error::API ${{ matrix.api-level }} emulator/test failed. Its diagnostics artifact was uploaded."
            exit 1
          fi
          if grep -Eqi 'ANR in com|APP NOT RESPONDING|Type: ANR' anr-artifacts/logcat-all.txt anr-artifacts/quantune-diagnostic-report.txt 2>/dev/null; then
            echo "::error::ANR detected on API ${{ matrix.api-level }}. Diagnostics were uploaded."
            exit 1
          fi
          echo "API ${{ matrix.api-level }} x86_64 fullscreen lyrics test passed."
