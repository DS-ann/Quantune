name: Quantune Fullscreen Lyrics ANR Emulator

on:
  push:
    branches:
      - debug/fullscreen-lyrics-anr
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Each commit gets its own diagnostic run; one slow emulator cannot block a newer revision.
  group: quantune-lyrics-anr-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build one armeabi-v7a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Build only the ARMv7a debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel assembleDebug -PquantuneEmulatorAbi=armeabi-v7a

          APK="app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          test -s "$APK"

          APK_COUNT="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one ABI APK, found $APK_COUNT"
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\\n' | sort
            exit 1
          fi

          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/debug/apk-badging.txt
          echo "Built exactly one APK:"
          ls -lh "$APK"

      - name: Upload the single ARMv7a APK
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-armv7a-debug
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 3

  reproduce:
    name: API ${{ matrix.api-level }} / ${{ matrix.memory_mb }} MiB emulator — test the same ARMv7a APK
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api-level: 23
            memory_mb: 3072
          - api-level: 30
            memory_mb: 3072
          - api-level: 35
            memory_mb: 7168
    timeout-minutes: 90

    steps:
      - name: Checkout test script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download the already-built ARMv7a APK
        uses: actions/download-artifact@v7
        with:
          name: Quantune-armv7a-debug
          path: app/build/outputs/apk/debug

      - name: Verify the downloaded APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          stat -c '%n (%s bytes)' "$APK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare diagnostics directory
        run: mkdir -p anr-artifacts

      - name: Boot emulator, open fullscreen lyrics and capture ANR data
        id: emulator
        # The hosted x86_64 emulator uses the Google APIs image's ARM translation
        # where available. The API 30 image explicitly includes ARMv7 support.
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
          ANDROID_MEMORY_MB: ${{ matrix.memory_mb }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory ${{ matrix.memory_mb }} -camera-back none
          disable-animations: true
          script: bash .github/scripts/fullscreen-lyrics-anr-emulator.sh

      - name: Upload emulator logs, app report, tombstones and ANR traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Quantune-fullscreen-lyrics-anr-api${{ matrix.api-level }}-${{ github.run_number }}
          path: anr-artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when reproduction or diagnostics indicate an ANR
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.emulator.outcome }}" != "success" ]]; then
            echo "::error::The fullscreen lyrics emulator test failed. Download the diagnostics artifact."
            exit 1
          fi
          if grep -Eqi 'ANR in com|APP NOT RESPONDING|Type: ANR' anr-artifacts/logcat-all.txt anr-artifacts/quantune-diagnostic-report.txt 2>/dev/null; then
            echo "::error::Fullscreen lyrics ANR detected. Diagnostics were uploaded."
            exit 1
          fi
          echo "Fullscreen lyrics opened on API ${{ matrix.api-level }} with no captured ANR."
